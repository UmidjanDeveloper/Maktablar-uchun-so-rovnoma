<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internet aloqasi yo'q — Kelajak Egasi</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 460px; }
      .icon { font-size: 64px; line-height: 1; margin-bottom: 16px; }
      h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: #64748b; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
      button {
        background: #2148e0;
        color: #fff;
        border: 0;
        border-radius: 14px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #1c39c4; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Internet aloqasi yo'q</h1>
      <p>
        Kompyuter internetga ulanmagan. Aloqa tiklangach sahifani yangilang —
        saqlangan anketalar avtomatik yuboriladi.
      </p>
      <button type="button" onclick="location.reload()">Qayta urinish</button>
    </div>
  </body>
</html>
